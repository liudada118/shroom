# SonarQube 分析配置（本地 Server 与 SonarQube Cloud 共用）
#
# 本地扫描：双击 / 执行 scan-local.bat（它负责传 host.url 和令牌）
# CI 扫描 ：由 .github/workflows/sonarqube-cloud.yml 触发，projectKey 和
#           organization 在 workflow 的 args 里覆盖，见该文件注释。
#
# 这里刻意不写 sonar.host.url —— 写死 localhost 会让 GitHub Actions 上的
# 扫描去连 runner 自己的 9000 端口而失败。地址由各自的调用方传入。
# 令牌属于凭据，同样不要写进本文件。

sonar.projectKey=SHROOM-HUMAN
sonar.projectName=SHROOM-HUMAN
sonar.projectVersion=1.2.9

sonar.sourceEncoding=UTF-8

# 扫描整个仓库，靠下面的 exclusions 剔除非源码目录
sonar.sources=.
sonar.tests=test,sdk/test

# 依赖、构建产物、数据库、数据文件、文档，全部排除
# （dist 约 2.3G、build 约 119M、db 约 136M，不排除会导致扫描极慢甚至失败）
sonar.exclusions=\
  **/node_modules/**,\
  dist/**,\
  build/**,\
  release/**,\
  client/build/**,\
  client/dist/**,\
  mattress-pressure-local-deploy/**,\
  db/**,\
  data/**,\
  PRD/**,\
  **/*.min.js,\
  **/vendor/**,\
  test/**,\
  sdk/test/**,\
  **/*.py

# 说明：为什么要排除 *.py
# client/package.json 里 jqtools2 / SHROOM-HUMAN / SHROOM-SEAT 都是 "file:.."，
# npm 因此在 client/node_modules 下建了三个指回项目根目录的符号链接，形成无限递归路径。
# SonarQube 的 Python 传感器（PackageRootResolver）会无视 sonar.exclusions 遍历整个目录树，
# 撞上这个环之后必定崩溃。项目里真正的 .py 只有 scripts/migrate_remarks.py 一个迁移脚本，
# 所以直接排除掉，让 Python 传感器不启动。若以后需要分析 Python，请先处理这三个自引用软链。

# 测试目录不参与重复代码检测
sonar.cpd.exclusions=test/**,sdk/test/**
